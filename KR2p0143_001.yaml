body:
  text: 睡虎地秦墓竹簡為吏之道凡為吏之道必精潔正直慎謹堅固審悉毋私微密韱察安靜毋苛審當賞罰嚴剛毋暴廉而毋刖毋復期勝毋以忿怒夬寬俗忠信和平毋怨悔過勿重茲下勿陵敬上勿犯聽間勿塞審智民能善度民力勞以𧗵之正以橋之反赦其身止欲去中不方名不章外不員尊賢養孽原壄如廷斷割不刖怒能喜樂能哀智能愚壯能衰恿能屈剛能柔仁能忍強良不得審耳目口十耳當一目安樂必戒毋行可悔以忠為幹慎前慮後君子不病殹以其病病殹同能而異毋窮窮毋岑岑毋衰衰臨材見利不取句富臨難見死不取句免欲富大甚貧不可得欲貴大甚賤不可得毋喜富毋惡貧正行修身過去福存吏有五善一曰中信敬上二曰精廉毋謗三曰舉事審當四曰喜為善行五曰龔敬多讓五者畢至必有大賞吏有五失一曰誇以迣二曰貴以大三曰擅裚割四曰犯上弗智害五曰賤士而貴貨貝一曰見民敖二曰不安其鼂三曰居官善取四曰受令不僂五曰安家室忘官府一曰不察所親不察所親則怨數至二曰不智所使不智所使則以權衡求利三曰興事不當興事不當則民易指四曰善言隋行則士毋所比五曰非上身及於死戒之戒之材不可歸謹之謹之謀不可遺慎之慎之言不可追綦之綦之食不可賞術惕之心不可不長以此為人君則鬼為人臣則忠為人父則茲為人子則孝能審行此無官不治無志不徹為人上則明為人下則聖君鬼臣忠父茲子孝政之本殹志徹官治上明下聖治之紀殹除害興利茲愛萬姓毋罪毋罪毋罪可赦孤寡窮困老弱獨傳均繇賞罰𠢕悍暴根田人邑賦斂毋度城郭官府門戶關籥除陛甬道命書時會事不且須貰責在外千佰津橋囷屋蘠垣溝渠水道犀角象齒皮革橐突久刻職物倉庫禾粟兵甲工用樓椑矢閲槍閵環殳比臧封印水火盜賊金錢羽旄息子多少徒隸攻丈作務員程老弱𤵸病衣食飢寒稿靳𤅋屚屋塗塈苑囿園池畜産肥𦍧朱珠丹青臨事不敬倨驕毋人苛難留民變民習浴須身旞過興事不時緩令急徵夬獄不正不精於材法置以私處如資言如盟出則敬毋施當昭如有光施而喜之敬而起之惠以聚之寬以治之有嚴不治與民有期安騶而步毋使民懼疾而毋諰簡而毋鄙當務而治不有可茝勞有成既事有幾時治則敬自賴之施而息之𤛬而牧之聽其有矢從而賊之因而徵之將而興之雖有高山鼓而乘之民之既教上亦毋驕孰道毋治發正亂昭安而行之使民望之道易車利精而勿致興之必疾夜以椄日觀民之詐罔服必固地修城固民心乃寧百事既成民心既寧既毋後憂從政之經不時怒民將姚去長不行死毋名富不施貧毋告也貴不敬失之毋君子敬如始戒之戒之言不可追思之思之某不可遺慎之慎之貨不可歸凡治事敢為固謁私圖畫局陳畀以為藉肖人聶心不敢徒語恐見惡凡戾人表以身民將望表以戾真表若不正民心將移乃難親操邦柄慎度量來者有稽莫敢忘賢鄙溉辥祿立有續孰暋上邦之急在𦡊級掇民之欲政乃立上毋間阹下雖善欲獨可急審民能以賃吏非以官祿夬助治不賃其人及官之暋豈可悔申之義以毄畸欲令之具下勿議彼邦之下恆行巧而威故移將發令索其政毋發可異史煩請令數環百姓榣二乃難請聽有方辨短長囷造之士久不陽草五年閏再十二月丙午朔辛亥告相邦民或棄邑居壄入人孤寡徼人婦女非邦之故也自今以來假門逆呂贅壻後父勿令為戶勿鼠田宇三枼之後欲士士之乃署其籍曰故某慮贅壻某叟之乃孫魏戶律草五年閏再十二月丙午朔辛亥告將軍假門逆贅壻後父或𧗵民不作不治室屋寡人弗欲且殺之不忍其宗族昆弟今遣從軍將軍勿恤視享牛食士賜之參飯而勿鼠殽攻城用其不足將軍以堙豪魏奔命律口關也舌幾也一堵失言四馬弗能追也口者關舌者符璽也璽而不發身亦毋薛人各食其所耆不以貧人各樂其所樂而以貧人
